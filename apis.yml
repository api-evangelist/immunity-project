name: Immunity Project
description: >-
  Immunity Project was a San Francisco nonprofit and Y Combinator company (batch
  Winter 2014, one of YC's first non-profits alongside Watsi) that set out to
  develop a free HIV/AIDS vaccine. Its approach studied naturally immune "HIV
  controllers" and applied machine learning to reverse-engineer the immune
  response, aiming to deliver a crowdfunded, virus-free vaccine via nasal spray.
  Founders included Reid Rubsamen, Naveen Jain, and Ian Cinnamon. The
  organization surfaced in the API Evangelist network as a Y Combinator portfolio
  lead; enrichment found no developer portal, documentation, or API surface, and
  its former domain (immunityproject.org) has lapsed and now redirects to an
  unrelated third-party news outlet, indicating the project is effectively
  defunct.
